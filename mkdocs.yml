site_name: FreeXmlToolkit Documentation
site_description: Universal Toolkit for XML - User Documentation
site_author: Karl Kauc
site_url: https://karlkauc.github.io/FreeXmlToolkit/

repo_name: karlkauc/FreeXmlToolkit
repo_url: https://github.com/karlkauc/FreeXmlToolkit

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
  logo: img/logo.png
  favicon: img/logo.png
  custom_dir: docs/overrides

plugins:
  - search:
      lang: en
  # Click on an image opens it full screen (zoom, arrow keys between the images of a page)
  - glightbox:
      zoomable: true
      draggable: true
      auto_caption: false
      skip_classes:
        - no-lightbox

# Internal developer-reference documents that are not part of the published site
# (gitignore-style patterns): planning/spec notes plus a few orphan dev docs.
# Pages kept only so that old links keep working
not_in_nav: |
  xml-editor-features.md

exclude_docs: |
  superpowers/
  ThreadPoolArchitecture.md
  testing/auto-update-windows.md

# Fail the (strict) build on broken links and anchors
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Community pages include the GitHub files from the repository root (single source).
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/karlkauc/FreeXmlToolkit
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/karlkauc
      name: Sponsor on GitHub
  generator: false

extra_css:
  - overrides/stylesheets/extra.css

extra_javascript:
  - overrides/javascripts/download.js

copyright: Copyright &copy; 2024-2026 Karl Kauc

