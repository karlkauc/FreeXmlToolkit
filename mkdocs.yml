site_name: FreeXmlToolkit Docs
site_description: Universal Toolkit for XML - User Documentation (XSD, XSLT, XQuery, Schematron, JSON, optional AI assistant and MCP server)
site_author: Karl Kauc
site_url: https://karlkauc.github.io/FreeXmlToolkit/

repo_name: karlkauc/FreeXmlToolkit
repo_url: https://github.com/karlkauc/FreeXmlToolkit

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
  # Brand (logo suite S1): Inter / JetBrains Mono as in the application
  font:
    text: Inter
    code: JetBrains Mono
  logo: img/logo-symbol.svg
  favicon: img/favicon.svg
  custom_dir: docs/overrides

plugins:
  - search:
      lang: en
  # Click on an image opens it full screen (zoom, arrow keys between the images of a page)
  # Old addresses (application, README, bookmarks) keep working; the fragment is carried over
  - redirects:
      redirect_maps:
        installation.md: get-started/install.md
        unified-shell.md: get-started/workspace-tour.md
        xml-editor.md: guides/edit-xml/index.md
        grid.md: guides/edit-xml/grid.md
        context-sensitive-intellisense.md: guides/edit-xml/auto-completion.md
        large-files.md: guides/edit-xml/large-files.md
        template-management.md: guides/edit-xml/templates.md
        favorites-system.md: guides/edit-xml/favorites.md
        bookmarks.md: guides/edit-xml/bookmarks.md
        json-editor.md: guides/json-yaml.md
        xsd-tools.md: guides/design-schemas/index.md
        profiled-xml-generation.md: guides/design-schemas/sample-xml.md
        schema-library.md: guides/design-schemas/schema-library.md
        validation-panel.md: guides/validate/index.md
        xsd-validation.md: guides/validate/xsd.md
        schematron-support.md: guides/validate/schematron.md
        schematron-quick-fixes.md: guides/validate/schematron-quick-fixes.md
        transform-panel.md: guides/transform-query/index.md
        xslt-viewer.md: guides/transform-query/xslt-quick-start.md
        xslt-developer.md: guides/transform-query/xslt-development.md
        query-console.md: guides/transform-query/query-console.md
        debugger.md: guides/transform-query/debug.md
        xproc.md: guides/transform-query/xproc.md
        pdf-generator.md: guides/publish-pdf.md
        digital-signatures.md: guides/sign-encrypt/signatures.md
        xml-encryption.md: guides/sign-encrypt/encryption.md
        projects.md: guides/projects.md
        ai-assistant.md: guides/ai-assistant.md
        industry-plugins.md: industry/index.md
        fundsxml-extensions.md: industry/fundsxml.md
        plugin-iso20022.md: industry/iso20022.md
        plugin-ebinterface.md: industry/ebinterface.md
        plugin-findatex.md: industry/findatex.md
        plugin-xbrl.md: industry/xbrl.md
        plugin-pk-meldewesen.md: industry/pk-meldewesen.md
        plugin-kag-meldewesen.md: industry/kag-meldewesen.md
        plugin-esma-reporting.md: industry/esma-reporting.md
        identifier-lookup.md: industry/identifier-lookup.md
        plugins.md: industry/manage-extensions.md
        command-line.md: automate/command-line.md
        mcp-server.md: automate/mcp-server.md
        administration.md: administer/policies.md
        offline-operation.md: administer/offline.md
        SECURITY.md: administer/security-features.md
        threat-model.md: administer/threat-model.md
        telemetry.md: administer/privacy-telemetry.md
        code-signing-policy.md: administer/code-signing.md
        file-associations.md: administer/file-associations.md
        inspector.md: reference/inspector.md
        keyboard-shortcuts.md: reference/keyboard-shortcuts.md
        settings.md: reference/settings.md
        language-versions.md: reference/standards-versions.md
        schema-support.md: reference/schema-support.md
        xsddoc-tags.md: reference/xsddoc-tags.md
        execution-statistics.md: reference/execution-statistics.md
        faq.md: reference/faq.md
        whats-new.md: reference/whats-new.md
        comparison.md: reference/comparison.md
        accessibility.md: reference/accessibility.md
        licenses.md: reference/licenses.md
        plugin-development.md: extend/writing-plugins.md
        technology-stack.md: extend/technology-stack.md
        contributing.md: extend/contributing.md
        code-of-conduct.md: extend/code-of-conduct.md
        security-policy.md: extend/security-policy.md
        xml-editor-features.md: guides/edit-xml/index.md
  - glightbox:
      zoomable: true
      draggable: true
      auto_caption: false
      skip_classes:
        - no-lightbox

# Internal developer-reference documents that are not part of the published site
# (gitignore-style patterns): planning/spec notes plus a few orphan dev docs.
exclude_docs: |
  superpowers/
  ThreadPoolArchitecture.md
  testing/auto-update-windows.md

# Fail the (strict) build on broken links and anchors
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Community pages include the GitHub files from the repository root (single source).
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/karlkauc/FreeXmlToolkit
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/karlkauc
      name: Sponsor on GitHub
  generator: false

extra_css:
  - overrides/stylesheets/extra.css

extra_javascript:
  - overrides/javascripts/download.js

copyright: Copyright &copy; 2024-2026 Karl Kauc

