# freexmltoolkit.org (static website, /var/www/freexmltoolkit.org).
# backend = polling is required, jail.local sets backend = systemd globally.
#
# Scanners: same path filter as quitt-/tanzapp-scanner (.env, .php, wp-, …).
[freexmltoolkit-scanner]
enabled  = true
backend  = polling
filter   = quitt-scanner
logpath  = /var/log/apache2/freexmltoolkit-access.log
port     = http,https
maxretry = 2
findtime = 1h
bantime  = 24h

# Floods: a page with its styles, scripts and images is about 20 requests; 600 in a
# minute is no reader. Keeps a flood on the website from slowing down the other
# sites on this Apache. Crawlers stay far below (Googlebot: < 1000 a day).
[freexmltoolkit-flood]
enabled  = true
backend  = polling
filter   = freexmltoolkit-flood
logpath  = /var/log/apache2/freexmltoolkit-access.log
port     = http,https
maxretry = 600
findtime = 60
bantime  = 10m
