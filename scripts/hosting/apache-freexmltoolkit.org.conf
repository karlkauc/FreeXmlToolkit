# Apache VHost for freexmltoolkit.org on an own server (Debian/Ubuntu Apache 2.4 + certbot).
#
# The site's rules live in the uploaded .htaccess files (website/.htaccess, docs/.htaccess):
# redirects, 404 pages, security headers, the documentation's CSP, caching, compression.
# This file only serves the folder and lets those files apply (AllowOverride All).
# HTTP and HTTPS in one file; the *:443 part is bound to the certificate by <IfFile>, so before
# certbot only the HTTP VHost is active and configtest stays green.
#
#   # upload user that can only rsync into the document root (no shell, no sudo, no forwarding):
#   sudo useradd --system --create-home --shell /bin/sh fxtweb && sudo passwd -l fxtweb
#   sudo mkdir -p /var/www/freexmltoolkit.org && sudo chown fxtweb: /var/www/freexmltoolkit.org
#   # ~fxtweb/.ssh/authorized_keys (own key pair, not an admin key):
#   #   command="/usr/bin/rrsync -no-del /var/www/freexmltoolkit.org",restrict ssh-ed25519 AAAA… upload
#   sudo cp scripts/hosting/apache-freexmltoolkit.org.conf /etc/apache2/sites-available/freexmltoolkit.org.conf
#   sudo a2enmod rewrite headers expires deflate mime ssl http2
#   sudo a2ensite freexmltoolkit.org && sudo apache2ctl configtest && sudo systemctl reload apache2
#   # upload (paths are relative to the document root; "fxtweb-upload" = ssh config alias with that key):
#   #   python3 scripts/upload-website.py --rsync fxtweb-upload: --docs
#   #   python3 scripts/upload-website.py --rsync fxtweb-upload:
#   # test before the DNS switch: curl -sI --resolve freexmltoolkit.org:80:<server-ip> http://freexmltoolkit.org/
#   # then point the A/AAAA records of freexmltoolkit.org and www.freexmltoolkit.org at the server, and:
#   sudo certbot certonly --apache -d freexmltoolkit.org -d www.freexmltoolkit.org
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Server-wide hardening (applies to every site on the server):
#   /etc/apache2/conf-available/security.conf: ServerTokens Prod, ServerSignature Off
#   /etc/apache2/mods-available/alias.conf: Alias /icons/ commented out (no directory listings)
# fail2ban (scanner paths 24 h, > 600 requests a minute 10 min):
#   sudo cp scripts/hosting/fail2ban-jail-freexmltoolkit.conf /etc/fail2ban/jail.d/freexmltoolkit.conf
#   sudo cp scripts/hosting/fail2ban-filter-freexmltoolkit-flood.conf /etc/fail2ban/filter.d/freexmltoolkit-flood.conf
#   sudo fail2ban-client reload   # the scanner jail reuses the server's filter quitt-scanner

<VirtualHost *:80>
    ServerName freexmltoolkit.org
    ServerAlias www.freexmltoolkit.org
    DocumentRoot /var/www/freexmltoolkit.org

    ErrorLog ${APACHE_LOG_DIR}/freexmltoolkit-error.log
    CustomLog ${APACHE_LOG_DIR}/freexmltoolkit-access.log combined

    # certbot's HTTP-01 challenge must stay reachable over plain HTTP; everything else goes to
    # https://freexmltoolkit.org (the .htaccess does the same once it is active).
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://freexmltoolkit.org%{REQUEST_URI} [END,NE,R=permanent]

    <Directory /var/www/freexmltoolkit.org>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<IfModule mod_ssl.c>
<IfFile /etc/letsencrypt/live/freexmltoolkit.org/fullchain.pem>
<VirtualHost *:443>
    ServerName freexmltoolkit.org
    ServerAlias www.freexmltoolkit.org
    DocumentRoot /var/www/freexmltoolkit.org
    Protocols h2 http/1.1

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/freexmltoolkit.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/freexmltoolkit.org/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/freexmltoolkit-error.log
    CustomLog ${APACHE_LOG_DIR}/freexmltoolkit-access.log combined

    <Directory /var/www/freexmltoolkit.org>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
</IfFile>
</IfModule>
