# /etc/freexmltoolkit/policy.properties
# Locked: users cannot change these settings.

# New versions come through the software distribution
update.allowed=false

# No telemetry, no first-start notice
fxt.telemetry.disabled=true
telemetry.usage.enabled=false
telemetry.errors.enabled=false

# No AI assistant, no MCP server
ai.allowed=false
ai.mcp.allowed=false

# Only the bundled Saxon HE and Apache FOP, no plugins from the plugins folder
xslt.external.allowed=false
fop.external.allowed=false
plugins.external.allowed=false

# Security switches stay off
ssl.trustAllCerts=false
security.xslt.allow.extensions=false
security.xproc.unrestricted=false
security.htmlPreview.allowActiveContent=false

# The company colour
ui.accent=#0b5394
