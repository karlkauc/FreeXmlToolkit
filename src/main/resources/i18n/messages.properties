QueryErrorHints.XTSE0010=An element in the XSLT namespace that XSLT does not know, or an instruction in the wrong place (e.g. xsl:template inside a template).\nCheck the spelling (xsl:value-of, xsl:for-each, xsl:apply-templates) and that top-level declarations are direct children of xsl:stylesheet.
QueryErrorHints.XTSE0020=An attribute has a value that is not allowed here, e.g. a mode or name that is not a valid QName, or yes/no misspelled.\nCheck the value against the instruction (Ctrl+Space in the attribute lists the allowed values).
QueryErrorHints.XTSE0090=This attribute is not allowed on this instruction. A frequent cause: select on an element that takes content (xsl:attribute in XSLT 1.0), or a typo in the name.\nIn XSLT, attributes of the XSLT namespace are written without prefix on xsl: elements and with xsl: prefix on result elements.
QueryErrorHints.XTSE0280=A prefix used in a name (mode, template, function, type) has no namespace declaration.\nDeclare it on xsl:stylesheet, e.g. xmlns:f="urn:my-functions".
QueryErrorHints.XTSE0650=xsl:call-template names a template that does not exist.\nCheck the name and that the module defining it is included or imported (names with a prefix must match its namespace).
QueryErrorHints.XTDE0640=A variable or parameter depends on itself (a circular definition), directly or through functions or templates.\nBreak the cycle, e.g. compute the value in one variable and pass it as a parameter.
QueryErrorHints.XTTE0590=A parameter value does not match the type declared with as="…".\nPass a value of that type (e.g. 5 for xs:integer) or convert it in the call, e.g. select="xs:integer($text)".
QueryErrorHints.XTDE0050=A required parameter (required="yes") got no value.\nPass it with xsl:with-param, or, for a stylesheet parameter, in the parameters of the Transform panel.
QueryErrorHints.XTSE0680=xsl:with-param names a parameter that the called template does not declare.\nAdd the xsl:param to the template, or remove or rename the xsl:with-param.
QueryErrorHints.XTDE0700=A template parameter that is required got no value from the call.\nAdd xsl:with-param with that name to the xsl:call-template or xsl:apply-templates.
QueryErrorHints.SXWN9001=A variable whose value nothing uses: it is the last instruction of its block, so no later instruction can refer to it.\nMove the instructions that use it after it, or remove it.
QueryErrorHints.XTDE0041=Only a function declared visibility="public" can be called from outside the stylesheet (Start: Function).\nAdd visibility="public" to the xsl:function, or start from a template that calls it.
