QueryErrorHints.XPTY0019=A path step "/" was applied to a value (text, number, date) instead of a node.\nFor values use "!" instead of "/", e.g. distinct-values(//Name) ! upper-case(.),\nor keep the nodes and atomize at the end: //Name[not(. = preceding::Name)]/../Id
QueryErrorHints.XPTY0020=An axis step (child, @attribute, ..) ran on a value instead of a node.\nPut the step on the nodes before they become values, e.g. //Fund[Ccy = "EUR"]/Name instead of distinct-values(//Ccy)[../Name]
QueryErrorHints.XPTY0004=A value has the wrong type for this operation, e.g. text where a number is needed.\nConvert it first: sum(//Amount ! number(.)), xs:date(@Date), or compare like with like ("5" = string(5)).
QueryErrorHints.FORG0001=A value could not be converted to the requested type.\nCheck its format: xs:date needs 2026-11-17, xs:decimal needs 1234.5 (dot, no thousands separator).\nnumber(.) returns NaN instead of failing for values that may be invalid.
QueryErrorHints.XPTY0004.cardinality=The operation needs one value, but the expression returns several (one per matching node).\nPick one with [1] or a predicate, e.g. //Fund[1]/Name, aggregate with sum() / string-join(),\nor apply it per item with "!": //Fund/Name ! concat(., "-x")
