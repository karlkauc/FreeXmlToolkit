SpreadsheetConverterDialog.help-export-table=Each record – an element that repeats, such as every <Order> – becomes one row, each value inside it one column (an attribute is written @name, a nested element Customer/Name). Choose the record below; the preview shows the first rows. You can edit the sheet in Excel and convert it back.
SpreadsheetConverterDialog.help-export-list=Every node of the document becomes one row: its XPath (its place in the document, such as /Orders/Order[2]/Date), its value and its kind. Harder to read than the table, but converting back gives exactly the same document, including empty elements and the order of all elements.
SpreadsheetConverterDialog.help-import=Turns a spreadsheet into XML. A sheet exported here is read back as it was. Any other table becomes one element per row inside a document element (the names below); its column headers become the element names (@name for an attribute, Address/City for a nested element). The preview shows the start of the XML.
SpreadsheetConverterDialog.tip-to-spreadsheet=Write the active XML document as an Excel workbook or a CSV file.
SpreadsheetConverterDialog.tip-to-xml=Read an Excel workbook or a CSV file and open the XML in a new tab.
SpreadsheetConverterDialog.tip-layout-table=One row per record, one column per value – like a normal table. Values outside the records (such as a header) go to the sheet "Other data". Empty elements inside a record are not kept.
SpreadsheetConverterDialog.tip-layout-list=One row per node with its XPath, value and kind. Use it when the way back must give exactly the same document.
SpreadsheetConverterDialog.tip-record=The repeating element whose every occurrence becomes one row. The default shows the most of the document while staying readable; the list names how many rows and columns each choice gives.
SpreadsheetConverterDialog.tip-input=The spreadsheet to convert. The active CSV document is filled in.
SpreadsheetConverterDialog.tip-root=The element around all rows of a table that was not exported here, e.g. Orders.
SpreadsheetConverterDialog.tip-record-name=The element each row becomes, e.g. Order. Each column becomes an element inside it.
SpreadsheetConverterDialog.tip-format=Excel (.xlsx) keeps typed cells, a frozen header and the sheets "Other data" and "Info". CSV is plain text with one table only.
SpreadsheetConverterDialog.tip-delimiter=The character between the values of a CSV line. German Excel uses the semicolon.
SpreadsheetConverterDialog.tip-schema=The XSD the values are read with: dates, numbers and booleans then get their XML form (31.01.2024 becomes 2024-01-31). Empty: the one the spreadsheet declares, if any.
SpreadsheetConverterDialog.tip-comments=Also write XML comments (<!-- … -->) as values.
SpreadsheetConverterDialog.tip-cdata=Also write CDATA sections (<![CDATA[ … ]]>) as values.
SpreadsheetConverterDialog.tip-type-column=Add a column naming each row's kind: element, attribute, text, comment or cdata.
SpreadsheetConverterDialog.tip-pretty-print=Indent the XML so each element starts on its own line.
