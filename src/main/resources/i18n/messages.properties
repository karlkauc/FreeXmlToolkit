# dialogs/TelemetryInfoDialog.fxml
TelemetryInfoDialog.freexmltoolkit-sends-anonymous-usage-statistics.text=FreeXmlToolkit sends anonymous usage statistics (which features are used, how long operations take, coarse document type such as XML or XSD, sizes and counts) and anonymous error reports (exception type and a stack signature of the application code). Your OS family, CPU architecture, Java version, UI language and app version are included.\n\nNever sent: file names, paths, document content, exception messages, user names, e-mail addresses or your IP address (the server derives only the country and discards the IP).\n\nThe data goes to a self-hosted server in the EU (Finland). You can switch both kinds of data off at any time in Settings ▸ Usage Statistics.
