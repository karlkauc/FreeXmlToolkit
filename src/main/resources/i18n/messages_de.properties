# dialogs/TelemetryInfoDialog.fxml
TelemetryInfoDialog.freexmltoolkit-sends-anonymous-usage-statistics.text=FreeXmlToolkit sendet anonyme Nutzungsstatistiken (welche Funktionen verwendet werden, wie lange Vorgänge dauern, grober Dokumenttyp wie XML oder XSD, Größen und Anzahlen) und anonyme Fehlerberichte (Ausnahmetyp und eine Stack-Signatur des Anwendungscodes). Ihre Betriebssystemfamilie, CPU-Architektur, Java-Version, UI-Sprache und App-Version werden mitgesendet.\n\nNie gesendet werden: Dateinamen, Pfade, Dokumentinhalte, Ausnahmemeldungen, Benutzernamen, E-Mail-Adressen oder Ihre IP-Adresse (der Server ermittelt nur das Land und verwirft die IP).\n\nDie Daten gehen an einen selbst betriebenen Server in der EU (Finnland). Sie können beide Datenarten jederzeit unter Einstellungen ▸ Nutzungsstatistik abschalten.
TelemetryInfoDialog.example-of-the-data-sent.text=Beispiel der gesendeten Daten (JSON):
