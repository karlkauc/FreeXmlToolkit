BreakpointPropertiesDialog.the-condition-is-evaluated-like.text=Die Bedingung wird bei jeder Ausführung der Zeile wie xsl:if test ausgewertet, mit dem Kontextelement und allen sichtbaren Variablen; eine fehlerhafte Bedingung hält an und zeigt den Fehler. Ein Treffer ist ein Durchlauf der Zeile, bei dem die Bedingung zutraf; Treffer werden pro Lauf gezählt und beginnen bei jedem Lauf oder Neustart von vorn. Eine Log-Meldung macht den Haltepunkt zum Logpoint: Bei jedem Treffer geht die Meldung an Meldungen, {xpath}-Teile werden ausgewertet; deaktivieren Sie Bei Treffer anhalten, um ohne Anhalten zu loggen.

