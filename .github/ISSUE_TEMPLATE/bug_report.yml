name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please remove confidential content from any files
        you attach. **Security vulnerabilities** must not be reported here — see the
        [Security Policy](https://github.com/karlkauc/FreeXmlToolkit/security/policy).
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I have searched the existing issues and this bug has not been reported yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open file '...'
        2. Switch to the Graphic view
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages if any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FreeXmlToolkit version
      description: Shown under **Help → About FreeXmlToolkit**.
      placeholder: e.g. 2.5.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2, macOS 15.3, Ubuntu 24.04
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Installer (.exe / .msi / .dmg / .pkg / .deb / .rpm)
        - Portable (.zip / .tar.gz)
        - Scoop
        - Homebrew
        - Built from source
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Sample files and screenshots
      description: |
        A minimal file (XML, XSD, XSLT, …) that reproduces the problem helps a lot.
        Drag and drop files or screenshots here.
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Relevant part of the log file — **Settings → Files & Cache → LOG FILES → Open log folder**.
        It is formatted as code automatically.
      render: shell
