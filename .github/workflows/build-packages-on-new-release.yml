name: Build and Release Executables

# Dieser Workflow wird bei jedem neuen Release gestartet
on:
  release:
    types: [ created ]
  # Manueller Start (z. B. zum Testen der macOS-Signierung): baut dieselben Pakete, legt sie
  # aber als Workflow-Artefakte ab statt sie an ein Release zu hängen.
  workflow_dispatch:

jobs:
  build:
    # Definiere eine Build-Matrix für alle jpackage Kombinationen
    strategy:
      matrix:
        include:
          # Windows builds - nur x64 (GitHub Actions hat keine ARM64 Windows Runner)
          - os: windows-latest
            arch: x64
            gradle-tasks: createWindowsExecutableX64
            artifact-pattern: "FreeXmlToolkit-x64-*.exe"
          - os: windows-latest
            arch: x64
            gradle-tasks: createWindowsMsiX64
            artifact-pattern: "FreeXmlToolkit-x64-*.msi"
          - os: windows-latest
            arch: x64
            gradle-tasks: createWindowsAppImageX64Zip
            artifact-pattern: "FreeXmlToolkit-windows-x64-app-image-*.zip"
          
          # macOS builds - native builds only (jpackage cannot cross-compile with runtime)
          - os: macos-latest  # ARM runner for native ARM builds (macOS 15 ARM64)
            arch: arm64
            gradle-tasks: createMacOSExecutableArm64
            artifact-pattern: "FreeXmlToolkit-arm64-*.dmg"
          - os: macos-latest  # ARM runner for native ARM builds (macOS 15 ARM64)
            arch: arm64
            gradle-tasks: createMacOSPkgArm64
            artifact-pattern: "FreeXmlToolkit-arm64-*.pkg"
          - os: macos-latest  # ARM runner for native ARM builds (macOS 15 ARM64)
            arch: arm64
            gradle-tasks: createMacOSAppImageArm64Zip
            artifact-pattern: "FreeXmlToolkit-macos-arm64-app-image-*.zip"
          - os: macos-15-intel  # Intel runner for native x64 builds (macOS 15 Intel)
            arch: x64
            gradle-tasks: createMacOSExecutableX64
            artifact-pattern: "FreeXmlToolkit-x64-*.dmg"
          - os: macos-15-intel  # Intel runner for native x64 builds (macOS 15 Intel)
            arch: x64
            gradle-tasks: createMacOSPkgX64
            artifact-pattern: "FreeXmlToolkit-x64-*.pkg"
          - os: macos-15-intel  # Intel runner for native x64 builds (macOS 15 Intel)
            arch: x64
            gradle-tasks: createMacOSAppImageX64Zip
            artifact-pattern: "FreeXmlToolkit-macos-x64-app-image-*.zip"
          
          # Linux builds - nur x64 (GitHub Actions hat keine ARM64 Linux Runner)
          - os: ubuntu-latest
            arch: x64
            gradle-tasks: createLinuxDebX64
            artifact-pattern: "freexmltoolkit-x64_*_amd64.deb"
          - os: ubuntu-latest
            arch: x64
            gradle-tasks: createLinuxRpmX64
            artifact-pattern: "freexmltoolkit-x64-*-1.x86_64.rpm"
          - os: ubuntu-latest
            arch: x64
            gradle-tasks: createLinuxAppImageX64Zip
            artifact-pattern: "FreeXmlToolkit-linux-x64-app-image-*.zip"

    # Der Job wird auf dem in der Matrix definierten Betriebssystem ausgeführt
    runs-on: ${{ matrix.os }}

    env:
      # Secrets sind in `if:` nicht verfügbar – ohne Zertifikat (z. B. in Forks) wird unsigniert gebaut
      MACOS_SIGNING_AVAILABLE: ${{ secrets.MACOS_APP_CERT_P12_BASE64 != '' }}

    steps:
      # Schritt 1: Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v5

      # Schritt 1.5: Datei-Zeitstempel auf aktuelle Build-Zeit setzen
      # GitHub Actions checkout setzt alle Zeitstempel auf 1980-01-01 (DOS-Epoch)
      - name: Set file timestamps to build time
        shell: bash
        run: |
          echo "Setting all file timestamps to current build time..."
          find . -type f -not -path "./.git/*" -exec touch {} \;
          echo "Timestamps updated to: $(date)"

      # Schritt 2: Java Development Kit (JDK) einrichten
      # Stelle sicher, dass du eine JDK-Version wählst, die jpackage enthält (JDK 14+)
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-package: 'jdk+fx'
          java-version: '25'
          distribution: 'liberica'

      - name: Setup Rust toolchain (Windows only)
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts (Windows only)
        if: matrix.os == 'windows-latest'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: update-helper

      # Schritt 3: Gradle Wrapper ausführbar machen (wichtig für Linux/macOS)
      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      # Schritt 3.5: Developer-ID-Zertifikate und Notarisierungs-Key bereitstellen (nur macOS)
      # Einrichtung der Secrets: siehe scripts/README.md
      - name: Import macOS signing certificates
        if: runner.os == 'macOS' && env.MACOS_SIGNING_AVAILABLE == 'true'
        env:
          APP_CERT_P12_BASE64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/fxt-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Zwischen-CA, damit die Zertifikatskette auf dem Runner vollständig ist
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"

          echo "$APP_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          if [ -n "$INSTALLER_CERT_P12_BASE64" ]; then
            echo "$INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP"/*.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KEYCHAIN_PATH"

          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8_BASE64" ]; then
            echo "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # Schritt 4: Führe die architektur-spezifischen Gradle-Tasks aus
      # Die macOS-Variablen schalten im Gradle-Build Signierung und Notarisierung ein;
      # auf Windows/Linux werden sie ignoriert.
      - name: Build with Gradle (${{ matrix.arch }})
        env:
          MACOS_SIGNING_IDENTITY: ${{ env.MACOS_SIGNING_AVAILABLE == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_ID: ${{ env.MACOS_SIGNING_AVAILABLE == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./gradlew ${{ matrix.gradle-tasks }}

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING_AVAILABLE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/fxt-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Der build.rs des Helpers soft-failt, wenn rc.exe fehlt — ohne Manifest
      # stuft UAC-Installer-Detection den Helper wieder als elevierungspflichtig
      # ein (CreateProcess error=740). Dieser Check macht das release-blockierend.
      - name: Verify update helper manifest (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe" | Select-Object -Last 1
          if (-not $mt) { Write-Error "mt.exe not found in Windows SDK"; exit 1 }
          & $mt.FullName -nologo -inputresource:"update-helper\target\release\fxt-update-helper.exe;#1" -out:extracted.manifest
          if ($LASTEXITCODE -ne 0) { Write-Error "No manifest embedded in fxt-update-helper.exe"; exit 1 }
          if (-not (Select-String -Path extracted.manifest -Pattern 'level="asInvoker"' -Quiet)) {
            Get-Content extracted.manifest
            Write-Error "Manifest does not request asInvoker"
            exit 1
          }
          Write-Host "✅ fxt-update-helper.exe manifest requests asInvoker"

      # Manueller Lauf: Pakete als Workflow-Artefakt ablegen
      - name: Upload workflow artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gradle-tasks }}
          if-no-files-found: error
          path: |
            build/dist/*.zip
            build/dist/*/*.exe
            build/dist/*/*.msi
            build/dist/*/*.dmg
            build/dist/*/*.pkg
            build/dist/*/*.deb
            build/dist/*/*.rpm

      # Schritt 5: Lade alle erstellten Artefakte mit dem GitHub CLI hoch
      - name: Upload Release Assets (${{ matrix.arch }})
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "📁 Contents of build/dist/ before upload:"
          ls -la build/dist/ || echo "build/dist/ directory not found"
          echo ""
          
          echo "🔍 Searching for package files in subdirectories:"
          find build/dist/ -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o -name "*.dmg" -o -name "*.pkg" -o -name "*.deb" -o -name "*.rpm" 2>/dev/null || echo "No package files found with find"
          echo ""
          
          # Find and upload all created files (more robust approach)
          found_files=0
          
          # Upload files matching the expected pattern
          for file in build/dist/${{ matrix.artifact-pattern }}; do
            if [ -f "$file" ]; then
              echo "📦 Uploading: $file ($(stat --format='%s' "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "unknown size") bytes)"
              if gh release upload ${{ github.event.release.tag_name }} "$file"; then
                echo "✅ Successfully uploaded: $file"
                found_files=$((found_files + 1))
              else
                echo "❌ Failed to upload: $file"
              fi
            fi
          done
          
          # Also try to upload any other files in build/dist/ and subdirectories that look like packages
          shopt -s nullglob
          for extension in exe msi zip dmg pkg deb rpm; do
            # Search in build/dist/ directly
            for file in build/dist/*.$extension; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                if ! gh release view ${{ github.event.release.tag_name }} | grep -q "$filename"; then
                  echo "📦 Uploading file: $file ($(stat --format='%s' "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "unknown size") bytes)"
                  if gh release upload ${{ github.event.release.tag_name }} "$file"; then
                    echo "✅ Successfully uploaded: $file"
                    found_files=$((found_files + 1))
                  else
                    echo "❌ Failed to upload: $file"
                  fi
                fi
              fi
            done
            
            # Search in build/dist/*/ subdirectories
            for file in build/dist/*/*.$extension; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                if ! gh release view ${{ github.event.release.tag_name }} | grep -q "$filename"; then
                  echo "📦 Uploading from subdirectory: $file ($(stat --format='%s' "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "unknown size") bytes)"
                  if gh release upload ${{ github.event.release.tag_name }} "$file"; then
                    echo "✅ Successfully uploaded: $file"
                    found_files=$((found_files + 1))
                  else
                    echo "❌ Failed to upload: $file"
                  fi
                fi
              fi
            done
          done
          
          if [ $found_files -eq 0 ]; then
            echo "⚠️  No files were uploaded!"
            echo "Expected pattern: ${{ matrix.artifact-pattern }}"
            exit 1
          else
            echo "🎉 Successfully uploaded $found_files file(s)"
          fi
